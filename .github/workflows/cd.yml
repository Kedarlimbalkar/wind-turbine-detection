name: CD - Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: windturbineacrkl.azurecr.io
          username: ${{ secrets.WINDTURBINEAPP_REGISTRY_USERNAME }}
          password: ${{ secrets.WINDTURBINEAPP_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: windturbineacrkl.azurecr.io/wind-turbine-app:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: windturbineacrkl
          containerAppName: wind-turbine-app
          resourceGroup: wind-turbine-rg
          imageToDeploy: windturbineacrkl.azurecr.io/wind-turbine-app:${{ github.sha }}