name: Trigger auto deployment for wind-turbine-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/wind-turbine-app-AutoDeployTrigger-bf05556e-9783-42b9-85ac-caeec14bf794.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WINDTURBINEAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WINDTURBINEAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WINDTURBINEAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: windturbineacrkl.azurecr.io
          registryUsername: ${{ secrets.WINDTURBINEAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WINDTURBINEAPP_REGISTRY_PASSWORD }}
          containerAppName: wind-turbine-app
          resourceGroup: wind-turbine-rg
          imageToBuild: windturbineacrkl.azurecr.io/wind-turbine-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


